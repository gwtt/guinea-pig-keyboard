name: Windows and macOS build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布已有版本标签（如 v0.1.0），留空仅构建'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Test friend sync and settings
        shell: pwsh
        run: |
          ./tools/test-friend-network.ps1
          ./tools/test-pixel-skins.ps1
      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WheekKeys
          path: dist/WheekKeys.exe
          if-no-files-found: error

  macos-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - name: Build universal app
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: bash macos/build.sh "$RELEASE_TAG"
      - name: Run Apple Silicon app from zip
        run: bash macos/test-package.sh dist/WheekKeys-macOS.zip
      - name: Save rendered Mac preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS-preview
          path: macos-frame.png
          retention-days: 5
      - name: Upload macOS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WheekKeys-macOS
          path: dist/WheekKeys-macOS.zip
          if-no-files-found: error

  macos-smoke:
    needs: macos-build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WheekKeys-macOS
      - name: Run Intel app from zip
        run: bash macos/test-package.sh WheekKeys-macOS.zip

  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [build, macos-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WheekKeys
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WheekKeys-macOS
          path: dist
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseJson = gh release view $env:RELEASE_TAG --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --draft --verify-tag --title "豚鼠键盘 $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
            $releaseJson = gh release view $env:RELEASE_TAG --json isDraft,assets
            if ($LASTEXITCODE -ne 0) { throw 'Could not read draft release.' }
          }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft) { throw 'Release is already published; refusing to modify it.' }
          foreach ($name in @('WheekKeys.exe', 'WheekKeys-macOS.zip')) {
            $asset = $release.assets | Where-Object { $_.name -eq $name }
            $buildPath = Join-Path 'dist' $name
            if ($asset) {
              $retryDir = Join-Path $env:RUNNER_TEMP 'release-retry'
              New-Item -ItemType Directory -Path $retryDir -Force | Out-Null
              gh release download $env:RELEASE_TAG --pattern $name --dir $retryDir
              if ($LASTEXITCODE -ne 0) { throw "Could not verify existing draft asset: $name" }
              $existingHash = (Get-FileHash (Join-Path $retryDir $name)).Hash
              $buildHash = (Get-FileHash $buildPath).Hash
              if ($existingHash -ne $buildHash) {
                if ($name -ne 'WheekKeys-macOS.zip') { throw "Draft asset differs from this build: $name" }
                gh release upload $env:RELEASE_TAG $buildPath --clobber
                if ($LASTEXITCODE -ne 0) { throw "Could not replace draft asset: $name" }
              }
            } else {
              gh release upload $env:RELEASE_TAG $buildPath
              if ($LASTEXITCODE -ne 0) { throw "Could not upload release asset: $name" }
            }
          }
          $releaseJson = gh release view $env:RELEASE_TAG --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify release assets.' }
          $release = $releaseJson | ConvertFrom-Json
          foreach ($name in @('WheekKeys.exe', 'WheekKeys-macOS.zip')) {
            if (-not ($release.assets | Where-Object { $_.name -eq $name })) { throw "Missing release asset: $name" }
          }
          $features = @('暂无')
          $fixes = @('暂无')
          # 为每个新版本填写对应的功能和修复。
          switch ($env:RELEASE_TAG) {
            'v0.1.5' {
              $features = @(
                'macOS 联机时，好友的小猪和键盘会显示在桌面上。'
                'Mac 和 Windows 可以双向同步按键和鼠标点击。Mac 版可在「联机」设置里暂停分享自己的动作。'
              )
              $fixes = @('修复 Windows 把同一房间里的 Mac 好友显示为「旧版 · 仅外观」的问题。')
            }
            'v0.1.6' {
              $features = @(
                'Windows 和 macOS 设置新增「QQ 群」标签，可用手机 QQ 扫码加群。'
                '启动或打开设置时自动检查更新，发现新版后可从设置中更新。'
                '默认桌宠大小调整为 58%，外观统一为像素系列。Windows 新增键鼠皮肤，移除搜狗输入法自动隐藏选项。'
              )
              $fixes = @('修复 macOS 无法拖动联机好友的问题。关闭鼠标穿透后可拖动好友，联机刷新会保留摆放位置。')
            }
            'v0.1.7' {
              $fixes = @(
                'Windows 切换键鼠皮肤只影响自己的桌宠，好友窗口保留独立的默认皮肤。'
                'Windows 和 macOS 联机时会在发现新好友后补发状态，并按顺序回放按键和左右点击，减少刚加入时的动作遗漏及动画互相打断。'
                'GitHub API 限流时可从官方发布页检查更新。Windows 在回退时通过浏览器打开发布页，macOS 提供新版安装包的下载入口。'
              )
            }
            'v0.1.8' {
              $features = @('Windows 和 macOS 的「桌宠设置」新增「开机自启」开关，开启后从下次登录开始自动启动。')
            }
            'v0.1.9' {
              $features = @(
                '联机统一使用公网房间。公开房间可被发现，私密房间通过房间码邀请，每间最多 16 人。'
                '桌宠设置新增「反馈问题」入口，可提交 Bug 或功能需求，直接创建 GitHub Issue。'
              )
              $fixes = @('解决公开房间入口难找的问题。打开联机页即可看到「房主昵称的公开房间」及人数，点击「加入」即可进房。')
            }
            'v0.2.0' {
              $features = @('Windows 新增 8 款趴趴外观，macOS 新增三花、黑白、黄白、奶油 4 款像素趴趴外观。')
              $fixes = @('调整 Windows 趴趴小猪的按键和点击动作，前后脚分开活动，抬爪和收爪更自然。')
            }
            'v0.2.1' {
              $features = @(
                '设置面板可调节透明度、切换键鼠皮肤，外观按短毛、长毛和趴趴猪分组。macOS 新增 4 款趴趴猪外观。'
                '双击可摸头，快速晃动鼠标会触发爆米花跳，连按四次退格键会让小猪瞪大眼睛。'
                'Windows 支持标准 HID 数位板，小猪会握笔，笔尖会随压力变化。'
              )
              $fixes = @(
                '联机只同步通用敲击和鼠标点击动画，具体键位在本机处理。'
                '精简设置和右键菜单，保留累计次数，移除今日统计、全屏自动隐藏、休眠时间设置、连击键帽流光、喂草和设置页的自定义外观管理入口。'
              )
            }
          }
          $notes = (@('新增功能：') + @($features | ForEach-Object { "- $_" }) +
            @('', '解决问题：') + @($fixes | ForEach-Object { "- $_" })) -join "`n"
          $notes | gh release edit $env:RELEASE_TAG --notes-file - --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
